# ============================================================================
# TLP Power Management Profile for ASUSTeK K95VJ (Linux Mint 22.3 / Ubuntu)
# Hardware: Intel Core i7-3630QM (Ivy Bridge), NVIDIA GT 635M (01:00.0),
#           Intel HM76, Atheros AR9485 Wi-Fi (03:00.0), Toshiba SATA HDD (sda)
#
# Goal:
#   - On AC (ACAD=1)      : 100% native full performance, zero restrictions.
#   - On Battery (ACAD=0) : Maximum safe power savings without breaking devices.
# ============================================================================

TLP_ENABLE=1
TLP_DEFAULT_MODE=AC
TLP_PERSISTENT_DEFAULT=0

# --- CPU (Intel Core i7-3630QM via intel_cpufreq, 1.2 GHz - 3.4 GHz) ---
CPU_SCALING_GOVERNOR_ON_AC=schedutil
CPU_SCALING_GOVERNOR_ON_BAT=powersave

CPU_SCALING_MIN_FREQ_ON_AC=1200000
CPU_SCALING_MAX_FREQ_ON_AC=3400000
CPU_SCALING_MIN_FREQ_ON_BAT=1200000
CPU_SCALING_MAX_FREQ_ON_BAT=2000000

# Full Turbo Boost on AC; disabled on Battery for major wattage savings
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Enforce hardware P-state percentage limits (required for intel_cpufreq)
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=55

# --- Storage (Mechanical SATA HDD: TOSHIBA MQ01ABD050) ---
DISK_DEVICES="sda"
# 254 = max performance / no aggressive spindown on AC; 128 = safe savings on BAT
DISK_APM_LEVEL_ON_AC="254"
DISK_APM_LEVEL_ON_BAT="128"

# Safe SATA link power management (avoids aggressive min_power HDD issues)
SATA_LINKPWR_ON_AC="max_performance"
SATA_LINKPWR_ON_BAT="med_power_with_dipm"

# Keep writeback safe (15s) on AC; extend to 60s only on Battery
MAX_LOST_WORK_SECS_ON_AC=15
MAX_LOST_WORK_SECS_ON_BAT=60

# --- PCIe & Runtime Power Management ---
# On AC: default ASPM and runtime PM forced 'on' (no forced device sleeping)
# On Battery: safe 'powersave' ASPM and runtime PM 'auto' (includes GPU root port 00:01.0)
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersave

RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# Allow TLP to manage nouveau GPU (01:00.0) runtime PM (on AC = active, on BAT = auto)
# Keep mei_me excluded for chipset stability
RUNTIME_PM_DRIVER_DENYLIST="mei_me"

# If Atheros AR9485 Wi-Fi (03:00.0) ever shows latency on battery, uncomment:
# RUNTIME_PM_DENYLIST="03:00.0"

# --- Wi-Fi & Audio ---
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# --- USB Autosuspend ---
# Explicitly exclude HID input devices AND the 2.4G Wireless receiver (32c2:0066)
USB_AUTOSUSPEND=1
USB_EXCLUDE_HID=1
USB_DENYLIST="32c2:0066"

# --- Kernel Watchdog ---
# Safe on both AC and Battery; eliminates unnecessary timer wakeups
NMI_WATCHDOG=0
